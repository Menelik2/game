name: CI

on:
  push:
    branches: [root, main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex_secret
          POSTGRES_DB: apex_casino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex_casino_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://apex:apex_secret@localhost:5432/apex_casino_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars
      DEMO_MODE: "true"
      REAL_MONEY_ENABLED: "false"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm install

      - name: Typecheck shared
        run: npm run typecheck --workspace=@apex/shared --if-present

      - name: Typecheck API
        run: npm run typecheck --workspace=@apex/api --if-present

      - name: Lint
        run: npm run lint --workspaces --if-present
        continue-on-error: true

      - name: Unit / integration tests
        run: npm test --workspace=@apex/api --if-present

      - name: Build API
        run: npm run build --workspace=@apex/api --if-present

      - name: Build Web
        run: npm run build --workspace=@apex/web --if-present
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_DEMO_MODE: "true"
