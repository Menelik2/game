services:
  - type: web
    name: equb-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build --workspace=@apex/shared --if-present && npm run build --workspace=@apex/api
    startCommand: npm run start:prod --workspace=@apex/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: REAL_MONEY_ENABLED
        value: "false"
      - key: API_PREFIX
        value: api
      - key: PORT
        value: "10000"
      - key: APP_URL
        value: https://abelgame.vercel.app
      - key: CORS_ORIGINS
        value: https://abelgame.vercel.app,https://*.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: equb-postgres
          property: connectionString

databases:
  - name: equb-postgres
    plan: free
    region: oregon
    databaseName: equb
    user: equb
